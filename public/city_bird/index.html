<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>从零开始的城市鸟生活</title>
    <style>
        html, body {
            height: 100%; /* 限制 html 和 body 的高度为父级容器的100% */
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: "微软雅黑", sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #2c3e50; /* 浏览器外层深色背景 */
            overflow: hidden; /* 防止手机端出现不必要的滚动条 */
        }
        /* 采用 CSS Grid 实现完美的分屏与手机端重排 */
        #game_container {
            display: grid;
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 600px;
            background-color: #f5f5f5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            
            /* 电脑端排版：左边 60% 文本，右边 40% 信息+按钮 */
            grid-template-columns: 6fr 4fr;
            /* 【核心修改】将上下高度比例固定为 7:3，彻底不受按钮有无的影响 */
            grid-template-rows: 7fr 3fr;
            grid-template-areas:
                "log info"
                "log action";
        }
        
        #log_area { 
            grid-area: log;
            background-color: #fff; 
            border-right: 2px solid #ddd; 
            padding: 20px; 
            overflow-y: auto; 
            font-size: 16px; 
            line-height: 1.6; 
        }
        
        #info_box { 
            grid-area: info;
            background-color: #fff; 
            padding: 20px; 
            border-bottom: 2px solid #ddd; 
            font-size: 16px; 
            line-height: 1.8; 
            display: none; /* JS会自动将其改为flex */
            flex-direction: column; /* 电脑端文字在上，图片在下 */
        }
        
        /* --- 修改：美术素材与动画样式（电脑端缩小为 144x144） --- */
        #sprite_container {
            flex: 1; /* 占据文字下方的所有空白区域 */
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
        }

        .bird-sprite {
            width: 144px;
            height: 144px;
            background-image: url('bird_test.png'); 
            background-size: 432px 576px; /* 原图 720x960 缩小至 60% */
            background-position: 0px 0px; /* 取第二行 */
            /* 采用 step-end 精确控制 4 步循环，周期 1.6 秒 */
            animation: walk-left 1.2s step-end infinite; 
        }

        /* 完美的“左-站-右-站”来回行走动画 */
        @keyframes walk-left {
            0%   { background-position: 0px 0px; }       /* 帧1：左脚迈出 */
            25%  { background-position: -144px 0px; }    /* 帧2：双脚站立 */
            50%  { background-position: -288px 0px; }    /* 帧3：右脚迈出 */
            75%  { background-position: -144px 0px; }    /* 帧2：收回站立 */
            100% { background-position: 0px 0px; }       /* 无缝接回左脚 */
        }
        
        #action_area { 
            grid-area: action;
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            padding: 20px; 
            gap: 10px; 
            background-color: #fafafa;
        }

        .action-btn { 
            padding: 12px 20px; 
            font-size: 16px; 
            border: none; 
            border-radius: 5px; 
            background-color: #007bff; 
            color: white; 
            cursor: pointer; 
            transition: background 0.2s; 
            min-height: 48px; /* 确保手机端手指容易点击 */
        }
        .action-btn:hover { background-color: #0056b3; }
        .log-line { 
            margin-bottom: 8px; 
            white-space: pre-wrap; /* 关键属性：强制保留代码里的连续空格和换行符 */
        }
        .separator { color: #888; font-weight: bold; }

        /* === 手机端完美适配 === */
        @media (max-width: 768px) {
            #game_container {
                max-width: 100%;
                max-height: 100%; /* 配合 body 的 100% 使用 */
                height: 100%;
                border-radius: 0;
                /* 手机端排版：上信息，中文本，下按钮 */
                grid-template-columns: 1fr;
                /* 【核心修改】信息栏自适应，文本框和操作区在移动端同样锁定为 7:3 的固定比例 */
                grid-template-rows: auto 8fr 2fr;
                grid-template-areas:
                    "info"
                    "log"
                    "action";
            }
            #info_box {
                padding: 10px 15px;
                font-size: 14px;
                line-height: 1.4;
                display: flex;
                flex-direction: row; /* 手机端横向排布：左文字，右素材 */
                justify-content: space-between;
                align-items: center;
            }
            
            #info_text {
                display: flex;
                flex-direction: column; /* 文字靠左换行显示 */
            }

            #info_text h3 {
                margin: 0 0 4px 0;
            }
            
            /* --- 手机端美术素材等比例缩放至 40% (96x96) --- */
            /* --- 手机端美术素材等比例缩放至 40% (96x96) --- */
            #sprite_container {
                flex: 0 0 auto;
                width: 96px; 
                height: 96px;
                margin-left: 10px;
            }

            .bird-sprite {
                width: 96px;
                height: 96px;
                background-size: 288px 384px; /* 720x960 缩小至 40% */
                background-position: 0px -96px; 
                animation: walk-left-mobile 1.6s step-end infinite;
            }

            @keyframes walk-left-mobile {
                0%   { background-position: 0px -96px; }       /* 左脚 */
                25%  { background-position: -96px -96px; }     /* 站立 */
                50%  { background-position: -192px -96px; }    /* 右脚 */
                75%  { background-position: -96px -96px; }     /* 站立 */
                100% { background-position: 0px -96px; }       /* 左脚 */
            }
            
            #log_area { 
                border-right: none; 
                padding-bottom: 30px; /* 底部 padding 增加到 30px，避免文字贴紧按钮 */
            }
            #action_area {
                border-top: 2px solid #ddd;
                padding: 15px;
                background-color: #fff;
            }
        }
    </style>
</head>

        function actions(buttons) {
            return new Promise(resolve => {
                const actionArea = document.getElementById("action_area");
                actionArea.innerHTML = ""; 
                buttons.forEach(btn => {
                    const buttonEl = document.createElement("button");
                    buttonEl.className = "action-btn";
                    buttonEl.innerText = btn.label;
                    buttonEl.onclick = () => {
                        actionArea.innerHTML = ""; 
                        resolve(btn.value);
                    };
                    actionArea.appendChild(buttonEl);
                });
                
                // 【核心修复】当按钮生成、撑高了底部区域后，强制让上方的文字框再次滚到底部
                setTimeout(() => {
                    const logArea = document.getElementById("log_area");
                    logArea.scrollTop = logArea.scrollHeight;
                }, 50);
            });
        }

            const result = randInt(1, 4) + value;

        // 完全还原原版逻辑的三回合战斗系统
        async function FightEvent(enemy) {
            await add_line("----------战斗开始----------");
            await Sleep();
            await add_line(`【${enemy.name} vs. ${Myinfo.name}】`);
            await Sleep();
            
            let tmp = [0, 0, 0];
            if (Mystat.AGE >= Myinfo.agelim) {
                await add_line("经年累月的生存使我的智慧增加，但行动能力变弱。（目标值修正）");
                tmp = [2, 2, -2];
            }
            
            let result = "";
            const skill = ["力量", "敏捷", "智慧"];
            
            for (let i = 1; i <= 3; i++) {
                await add_line(`---第${i}/3轮---`);
                await Sleep();
                let sceneText = eventData.Fight[i].text.replace("{enemy}", enemy.name);
                await add_line(sceneText + "我选择——");
                await add_line(" ");
                await Sleep();
                
                let btns = [];
                for (let j = 1; j <= 3; j++) {
                    let curTarget = enemy.fight[j-1] + tmp[j-1];
                    await add_line(`  <${j}> ${eventData.Fight[i][skill[j-1]]}（${skill[j-1]}${Myinfo.fight[j-1]} 目标${curTarget}）`);
                    btns.push({label: `<${j}>`, value: j});
                }
                
                let Mychoice = await actions(btns);
                await Sleep();
                
                let roll_random = randInt(1, 12);
                let roll_value = Myinfo.fight[Mychoice - 1];
                let roll = roll_random + roll_value;
                let target = enemy.fight[Mychoice - 1] + tmp[Mychoice - 1];
                
                await add_line(" ");
                await add_line(`掷骰<1d12=${roll_random}> + 属性<${roll_value}> = 最终结果<${roll}>`);
                await Sleep();
                
                let actionKey = (i * 10) + Mychoice;
                if (roll >= 2 * target) {
                    result = "win";
                    await add_line("最终结果大于目标值两倍——");
                    await Sleep();
                    await add_line(`对手${eventData.Fight[actionKey].win}，放弃了捕食。`);
                    await add_line(" ");
                    break;
                } else if (roll < target / 2) {
                    result = "lose";
                    await add_line("最终结果小于目标值一半——");
                    await Sleep();
                    await add_line(`对手${eventData.Fight[actionKey].lose}，然后致命一击。`);
                    await add_line(" ");
                    break;
                } else if (roll >= target) {
                    result = "favoured";
                    await add_line("最终结果大于目标值——");
                    await Sleep();
                    await add_line(`对手${eventData.Fight[actionKey].favoured}，让我在下一轮中占有优势。`);
                    await add_line(" ");
                    tmp[Mychoice - 1] -= 3;
                } else {
                    result = "ill-favoured";
                    await add_line("最终结果小于目标值——");
                    await Sleep();
                    await add_line(`对手${eventData.Fight[actionKey]["ill-favoured"]}，让我在下一轮中处于劣势。`);
                    await add_line(" ");
                    tmp[Mychoice - 1] += 3;
                }
                await Sleep();
            }
            
            await add_line("----------战斗结束----------");
            await add_line(" ");
            if (result === "win") {
                await add_line(`我幸运地逃脱了${enemy.name}的追捕。`);
                await add_line(" ");
            } else {
                await add_line(`我没能逃脱，成为了${enemy.name}的美餐。`);
                await add_line(" ");
                Mystat.LIVE = 0;

                // === 新增：判定吃掉我的敌人，是不是在我的好友列表里 ===
                // 遍历好友列表的ID，核对它们的名字是否等于凶手的名字
                const isFriend = Mystat.Friendlist.some(id => eventData.Friend[id] && eventData.Friend[id].name === enemy.name);
                if (isFriend) {
                    Mystat.KilledByFriend = true; // 做一个死亡标记
                }
            }
            await Sleep();
        }

        async function EndGame() {
            await add_line("/".repeat(20), true);
            await add_line(`作为一只${Myinfo.name}，\n在我长达${Mystat.AGE}年的一生中，养育了${Mystat.Childcount}个后代，\n与人类近距离接触${Mystat.Humanlist.length}次，死里逃生${Mystat.Deathcount}次，`);
            await Sleep();
            
            let friendStr = Mystat.Friendlist.map(id => eventData.Friend[id].name).join(" ");
            await add_line(`结交了鸟类朋友：${friendStr}，\n收到${Mystat.Giftlist.length}份特别的礼物。\n`);
            await Sleep();
            
            await add_line(randChoice(eventData.Endtext));
            await add_line("/".repeat(20), true);
            await Sleep();
            
            // 【新增】每次游戏结束时，动态获取当前局的属性进行判定
            const currentAchievements = [
                { id: 'age7', condition: Mystat.AGE >= 7, text: '【寿比南山】——年龄达到7岁！' },
                { id: 'child7', condition: Mystat.Childcount >= 7, text: '【子孙满堂】——拥有7个后代！' },
                { id: 'child0', condition: Mystat.Childcount === 0, text: '【自然选择】——没有后代！' },
                { id: 'friend5', condition: Mystat.Friendlist.length >= 5, text: '【朋友遍天下】——拥有5个朋友！' },
                { id: 'friend0', condition: Mystat.Friendlist.length === 0, text: '【社恐】——没有朋友！' },
                { id: 'human5', condition: Mystat.Humanlist.length >= 5, text: '【人类之友】——遇到人类5次！' },
                { id: 'gift3', condition: Mystat.Giftlist.length >= 3, text: '【羽毛收藏者】——在一局中获得3种礼物！' },
                { id: 'death5', condition: Mystat.Deathcount >= 5, text: '【求生欲】——逃脱死亡5次！' },
                { id: 'food10', condition: Mystat.FOOD >= 10, text: '【粮仓】——没来得及吃的食物成为其他鸟的粮仓！' },
                { id: 'exp10', condition: Mystat.EXP >= 10, text: '【教科书】——丰富经验被写成笔记代代相传！' },
                { id: 'age1', condition: Mystat.AGE <= 1, text: '【雏鸟】——没有活过第一年！' },
                { id: 'eatenByFriend', condition: Mystat.KilledByFriend, text: '【最好吃的朋友】——成为朋友的美食！' }
            ];

            let newlyUnlocked = false;

            // 注意这里的循环变量改成了 currentAchievements
            for (let ach of currentAchievements) {
                if (ach.condition) {
                    if (!unlockedAchievements.includes(ach.id)) {
                        // 如果是新成就，存入列表并特殊高亮显示
                        unlockedAchievements.push(ach.id);
                        newlyUnlocked = true;
                        await add_line(`🌟 【新成就解锁】恭喜达成${ach.text}`);
                    } else {
                        // 以前拿过的成就普通显示
                        await add_line(`⭐ 成就：${ach.text}`);
                    }
                }
            }

            // 如果本局有新成就，统一保存到浏览器的 localStorage 中
            if (newlyUnlocked) {
                localStorage.setItem('bird_achievements', JSON.stringify(unlockedAchievements));
            }
                        
            await Sleep();
            await add_line(" ");
            await add_line("提示：本作品以游戏性为主，参考但可能不完全符合真实鸟类知识。");
            await add_line(" ");
            await add_line("要再来一局吗？");
            await add_line("  <1> 重新开始\n  <2> 返回标题\n");
            
            const choice = await actions([{label: "<1>", value: 1}, {label: "<2>", value: 2}]);
            
            if (choice === 1) {
                await add_line(" ");
                await add_line("转生中……");
                await Sleep(1000);
                await main_game();
            } else {
                await ShowWelcome(); // 点击选项2时，直接重新调用标题界面函数
            }
        }

        // 核心循环
        async function main_game() {
            await BeginGame();
            while (Mystat.LIVE === 1) {
                await NewYear();
                let funlist = [];
                if (Mystat.AGE === 1) {
                    funlist = [FriendEvent, HumanEvent];
                } else {
                    funlist = [FriendEvent, HumanEvent, BreedEvent];
                }
                funlist = funlist.sort(() => 0.5 - Math.random());
                
                for (let f of funlist) {
                    await f();
                    await Sleep();
                    if (Mystat.LIVE === 0) break; 
                }
            }
            await EndGame();
        }

        window.onload = ShowWelcome;
    </script>
</body>
</html>
